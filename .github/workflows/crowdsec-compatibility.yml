name: CrowdSec compatibility
on:
  push:
    branches: [develop, main]
    paths:
      - 'docker/caddy/**'
      - 'docker/crowdsec/**'
      - 'docker/l4-port-manager/**'
      - 'scripts/check-crowdsec-compose.py'
      - 'docker-compose*.yml'
      - 'documentation/examples/crowdsec/**'
      - 'tests/unit/caddy-crowdsec.test.ts'
      - 'tests/unit/crowdsec-overlay.test.ts'
      - '.github/workflows/crowdsec-compatibility.yml'
  pull_request:
    paths:
      - 'docker/caddy/**'
      - 'docker/crowdsec/**'
      - 'docker/l4-port-manager/**'
      - 'scripts/check-crowdsec-compose.py'
      - 'docker-compose*.yml'
      - 'documentation/examples/crowdsec/**'
      - 'tests/unit/caddy-crowdsec.test.ts'
      - 'tests/unit/crowdsec-overlay.test.ts'
      - '.github/workflows/crowdsec-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: docker/caddy/go.sum
      - name: Resolve the pinned bouncer module (root module, not the /http package)
        working-directory: docker/caddy
        run: go list -m github.com/hslatman/caddy-crowdsec-bouncer
      - name: Build through Ingressi's manifest pipeline
        run: docker build -f docker/caddy/Dockerfile -t ingressi-crowdsec:ci .
      - name: Validate the generated CrowdSec config and the registered modules
        run: |
          docker run --rm -e CROWDSEC_API_KEY=ci-validation-key \
            --mount "type=bind,source=$PWD/documentation/examples/crowdsec/caddy-validate.json,target=/tmp/validate.json,readonly" \
            ingressi-crowdsec:ci caddy validate --config /tmp/validate.json
          docker run --rm ingressi-crowdsec:ci caddy build-info | grep 'github.com/hslatman/caddy-crowdsec-bouncer'
          docker run --rm ingressi-crowdsec:ci caddy list-modules | grep '^http.handlers.crowdsec$'
          docker run --rm ingressi-crowdsec:ci caddy list-modules | grep '^crowdsec$'
          docker run --rm ingressi-crowdsec:ci caddy list-modules | grep 'dns.providers.bunny'
      - name: Build the fork port manager and test merged deployment and recreation
        run: |
          docker build -f docker/l4-port-manager/Dockerfile -t ingressi-l4-port-manager-crowdsec:local .
          python3 scripts/check-crowdsec-compose.py
