services:
  web:
    ports: !override
      - "3000:3000"
    extra_hosts:
      - "vllm-qween-tt1-anm-ai2.apps.cloudgpu.mbf.vn:10.2.50.22"
    volumes:
      - type: bind
        source: /home/dockerwaf/caddy-logs
        target: /logs
        bind:
          create_host_path: false
  caddy:
    volumes:
      - type: bind
        source: /home/dockerwaf/caddy-logs
        target: /logs
        bind:
          create_host_path: false
  crowdsec:
    volumes:
      - type: bind
        source: /home/dockerwaf/caddy-logs
        target: /logs
        read_only: true
        bind:
          create_host_path: false
  docker-socket-proxy:
    volumes:
      - type: bind
        source: /run/user/1001/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
  clickhouse:
    image: ${CH_IMAGE:?Set CH_IMAGE to a pinned clickhouse image}
    ports:
      - "9009:9009"
    volumes:
      - ./deploy/clickhouse/replication.xml:/etc/clickhouse-server/config.d/ingressi-replication.xml:ro
  clickhouse-keeper:
    container_name: ingressi-clickhouse-keeper
    # Same image as ClickHouse; run its bundled Keeper as a separate process.
    image: ${CH_IMAGE:?Set CH_IMAGE to a pinned clickhouse image}
    user: "0:0"
    entrypoint: ["clickhouse", "keeper", "--config", "/etc/clickhouse-keeper/keeper.xml"]
    restart: unless-stopped
    ports:
      - "9181:9181"
    volumes:
      - ./deploy/clickhouse/keeper.xml:/etc/clickhouse-keeper/keeper.xml:ro
      - clickhouse-keeper-data:/var/lib/clickhouse-keeper
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD-SHELL", "printf ruok | nc -w 2 127.0.0.1 9181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s
  l4-port-manager:
    environment:
      COMPOSE_HOST_DIR: /home/dockerwaf/ingressi
      COMPOSE_SKIP_OVERRIDE: "1"
volumes:
  clickhouse-keeper-data:
